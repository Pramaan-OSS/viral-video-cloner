name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PRAMAAN_API_KEY: ""
  PRAMAAN_FAKE: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: UTC
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.check == 'typecheck'
        run: pnpm check
      - if: matrix.check != 'typecheck'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core=2.37-8 fontconfig
          fc-match sans-serif
          ffmpeg -version
          ffprobe -version
      - name: Allow the pinned test browser to use its Linux sandbox
        if: matrix.check == 'test'
        # Ubuntu's AppArmor restriction blocks the downloaded Chrome for Testing.
        # Keep Chrome's sandbox enabled; permit user namespaces on this test runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: matrix.check == 'test'
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: packages/provider-image-opencv-local/runtime/uv.lock
      - if: matrix.check == 'test'
        run: uv sync --project packages/provider-image-opencv-local/runtime --frozen --python "$(cat .python-version)"
      - name: Install package-pinned capture Chrome and HTML headless shell
        if: matrix.check == 'test'
        run: node --import tsx scripts/ci-browsers.mjs
      - if: matrix.check == 'test'
        env:
          HYPIT_BROWSER_TESTS: "1"
          HYPIT_OPENCV_TESTS: "1"
          HYPIT_OPENCV_PYTHON: packages/provider-image-opencv-local/runtime/.venv/bin/python
        run: |
          pnpm test
          pnpm test:runtime-scale
      - if: matrix.check == 'build'
        run: |
          npm run pack:release-candidate
          npm run check:release-candidate
  alignment-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: packages/provider-whisperx-local/runtime/uv.lock
      - run: uv sync --project packages/provider-whisperx-local/runtime --frozen --python "$(cat .python-version)"
      - run: uv run --project packages/provider-whisperx-local/runtime --frozen python -m unittest discover -s packages/provider-whisperx-local/test/service -p 'test_*.py'
